name: React Native CI

on:
  push:
    branches: [ main, master, Warif_unittest]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: './craftmate/package.json'
    
    - name: Install dependencies
      run: npm ci
      working-directory: ./craftmate
      
    - name: Run tests
      run: npm test
      working-directory: ./craftmate
      
    - name: Run linting
      run: npm run lint || true
      working-directory: ./craftmate
