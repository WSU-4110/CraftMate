name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./craftmate

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16.x'
        cache: 'npm'
        cache-dependency-path: './craftmate/package-lock.json'
    
    - name: Install dependencies
      run: npm install
    
    - name: Install Expo CLI
      run: npm install -g expo-cli eas-cli
    
    - name: Build project
      run: |
        npm run build
        npm run build:web
    
    - name: Run tests with coverage
      run: npm run test:ci
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: craftmate/coverage/
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: web-build
        path: craftmate/dist/
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: craftmate/dist
        branch: gh-pages
